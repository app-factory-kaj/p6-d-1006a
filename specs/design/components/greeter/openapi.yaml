openapi: 3.0.3
info:
  title: Greeter API
  version: 0.1.0
  description: Returns a JSON greeting for a given name.
servers:
  - url: /
paths:
  /hello:
    get:
      operationId: getGreeting
      summary: Return a greeting for the given name, or a default greeting
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: The name to greet
      responses:
        '200':
          description: The greeting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required: [message]
      properties:
        name:
          type: string
          description: The name that was greeted, when provided
        message:
          type: string
          description: The greeting text, e.g. "Hello, World!"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: short human-readable error message (per app-factory-kaj/e2e-reference conventions)
